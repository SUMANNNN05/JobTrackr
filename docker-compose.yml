services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtrackr
      POSTGRES_USER: jobtrackr
      POSTGRES_PASSWORD: jobtrackr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrackr -d jobtrackr"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: jobtrackr
      DB_USER: jobtrackr
      DB_PASSWORD: jobtrackr
    ports:
      - "8080:8080"

volumes:
  pgdata:
