server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: jobtrackr
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtrackr}
    username: ${DB_USER:jobtrackr}
    password: ${DB_PASSWORD:jobtrackr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway migrations
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true         # Java 21 virtual threads for request handling

app:
  jwt:
    # Base64-encoded, >= 32 bytes. Override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:am9idHJhY2tyLWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2QtMDEyMzQ1Njc4OQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
